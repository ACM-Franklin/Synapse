# Discord Properties
synapse.discord.token=${SYNAPSE_DISCORD_TOKEN:replace-me}
synapse.discord.guild.id=${SYNAPSE_DISCORD_GUILD_ID:0}
synapse.discord.scan-historical=${SYNAPSE_DISCORD_SCAN_HISTORICAL:false}

# Discord OAuth2 (frontend login flow)
synapse.discord.oauth.client-id=${SYNAPSE_DISCORD_CLIENT_ID:}
synapse.discord.oauth.client-secret=${SYNAPSE_DISCORD_CLIENT_SECRET:}
synapse.discord.oauth.redirect-uri=${SYNAPSE_DISCORD_REDIRECT_URI:http://localhost:8080/api/auth/callback}
synapse.discord.oauth.frontend-redirect-uri=${SYNAPSE_FRONTEND_REDIRECT_URI:http://localhost:5173/}
synapse.discord.oauth.authorize-url=${SYNAPSE_DISCORD_AUTHORIZE_URL:https://discord.com/api/oauth2/authorize}
synapse.discord.oauth.token-url=${SYNAPSE_DISCORD_TOKEN_URL:https://discord.com/api/oauth2/token}
synapse.discord.oauth.api-base-url=${SYNAPSE_DISCORD_API_URL:https://discord.com/api/v10}

# Auth / session
synapse.auth.session.cookie-name=synapse_session
synapse.auth.session.ttl-seconds=${SYNAPSE_SESSION_TTL_SECONDS:86400}
synapse.auth.session.cookie-secure=${SYNAPSE_SESSION_COOKIE_SECURE:false}
synapse.auth.oauth.state-cookie-name=synapse_oauth_state
synapse.auth.oauth.state-ttl-seconds=${SYNAPSE_OAUTH_STATE_TTL_SECONDS:300}
synapse.auth.admin-role-ids=${SYNAPSE_ADMIN_ROLE_IDS:}

# Small single-instance API rate limiter
synapse.api.rate-limit.enabled=${SYNAPSE_API_RATE_LIMIT_ENABLED:true}
synapse.api.rate-limit.window-seconds=${SYNAPSE_API_RATE_LIMIT_WINDOW_SECONDS:60}
synapse.api.rate-limit.default-requests=${SYNAPSE_API_RATE_LIMIT_DEFAULT_REQUESTS:120}
synapse.api.rate-limit.auth-requests=${SYNAPSE_API_RATE_LIMIT_AUTH_REQUESTS:20}
synapse.api.rate-limit.admin-mutation-requests=${SYNAPSE_API_RATE_LIMIT_ADMIN_MUTATION_REQUESTS:5}

# DB Migrations
synapse.datasource.auto-migrate=${SYNAPSE_DATASOURCE_AUTOMIGRATE:false}
synapse.datasource.schema=/schemas/synapse.sql
synapse.datasource.migrations=/schemas/migrations/

# DB Configuration - Dev (SQLite)
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:target/synapse.sqlite

# CORS for the separate frontend repo
quarkus.http.cors=true
quarkus.http.cors.origins=${SYNAPSE_FRONTEND_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-allow-credentials=true

# Production profile — PostgreSQL. Set SYNAPSE_DB_URL to a real jdbc:postgresql URL.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${SYNAPSE_DB_USERNAME:synapse}
%prod.quarkus.datasource.password=${SYNAPSE_DB_PASSWORD:}
%prod.quarkus.datasource.jdbc.url=${SYNAPSE_DB_URL:jdbc:postgresql://localhost:5432/synapse}
%prod.synapse.auth.session.cookie-secure=true
%prod.quarkus.http.non-application-root-path=/internal/q

# Test profile — disable the bot startup so unit tests don't try to connect to Discord.
%test.synapse.discord.token=test-token
%test.synapse.discord.oauth.client-id=test-client
%test.synapse.discord.oauth.client-secret=test-secret
%test.quarkus.http.test-port=0
%test.quarkus.arc.exclude-types=edu.franklin.acm.synapse.bot.SynapseBot
